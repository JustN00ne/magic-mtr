# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

# Minecraft Properties
minecraft_version=1.20.1
# Supported values: 1.16.5 through 1.20.4

# Fabric Loader Properties
# Minimum Fabric Loader version required at runtime (declared in fabric.mod.json).
min_loader_version=0.14.0
# Fabric Loader used for compiling and dev runs. Keep it below 0.18: its Mixin 0.17 writes @Redirect `at` as an
# array, which older Mixin versions (most player installs) cannot read.
loader_version=0.17.3

# Mod Properties
mod_version=1.5.0
maven_group=org.justnoone
archives_base_name=MAGIC
